<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>HangeulTruck</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: white;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      #image-wrapper {
        position: relative;
        width: 100%;
        max-width: 900px;
        aspect-ratio: 1080 / 3400;
        max-height: none;
      }

      #bg-image {
        display: block;
        width: 100%;
        height: 100%;
      }

      .clickable-link {
        position: absolute;
        display: block;
        z-index: 2;
        /* background-color: rgba(255, 0, 0, 0.3); */
      }

      .clickable-link.usc {
        top: 77.5%;
        left: 25%;
        width: 45%;
        height: 2.2%;
      }

      .clickable-link.ucla {
        top: 79.95%;
        left: 25%;
        width: 42%;
        height: 2.2%;
      }

      .clickable-link.us-berkeley {
        top: 82.4%;
        left: 25%;
        width: 51%;
        height: 2.2%;
      }

      .clickable-link.stanford {
        top: 84.8%;
        left: 25%;
        width: 56.5%;
        height: 2.2%;
      }

      .clickable-link.art-center {
        top: 87.25%;
        left: 25%;
        width: 69%;
        height: 2.2%;
      }

      .clickable-link.sanfrancisco-civic {
        top: 89.65%;
        left: 25%;
        width: 54.5%;
        height: 2.2%;
      }
    </style>
  </head>
  <body>
    <div id="image-wrapper">
      <img id="bg-image" src="main_event.jpg" alt="background" />

      <a
        href="https://maps.app.goo.gl/RmQuKGHe7gKCVBV4A"
        target="_blank"
        class="clickable-link usc"
        aria-label="USC, McCarthy Quad"
      ></a>
      <a
        href="https://maps.app.goo.gl/HH974fQHwosfMuLw9"
        target="_blank"
        class="clickable-link ucla"
        aria-label="UCLA, Court of Sciences"
      ></a>
      <a
        href="https://maps.app.goo.gl/kiFzq7msydBMSzFb7"
        target="_blank"
        class="clickable-link us-berkeley"
        aria-label="US Berkeley, South Hall rd."
      ></a>
      <a
        href="https://maps.app.goo.gl/GWFnFxCcPjGUjP7m8"
        target="_blank"
        class="clickable-link stanford"
        aria-label="Stanford, South Lawn"
      ></a>
      <a
        href="https://maps.app.goo.gl/PMY7cM3JAn3R1tRf7"
        target="_blank"
        class="clickable-link art-center"
        aria-label="ArtCenter College Of Design"
      ></a>
      <a
        href="https://maps.app.goo.gl/QswLtM34Ug5Gp6736?g_st=ic"
        target="_blank"
        class="clickable-link sanfrancisco-civic"
        aria-label="San Francisco Civic Center"
      ></a>
    </div>
  </body>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAnalytics,
      logEvent,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9d2wSrmgCLdnr9ZtGGDARzaj78n6mm9I",
      authDomain: "hangul-truck.firebaseapp.com",
      projectId: "hangul-truck",
      storageBucket: "hangul-truck.firebasestorage.app",
      messagingSenderId: "141768649099",
      appId: "1:141768649099:web:2b7188b8f7b9ae77d4a78e",
      measurementId: "G-H4RZGYHQDV",
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // 이미지 소스 결정 함수
    function determineImageSource() {
      const urlParams = new URLSearchParams(window.location.search);
      const previewParam = urlParams.get("v");

      // 미리보기 파라미터가 있으면 new 버전 이미지 사용
      if (previewParam === "_hangeul_truck_preview_20251006") {
        document.title = "HangeulTruck_Preview";
        return "main_new.jpeg";
      }

      const now = new Date();

      const startDate = new Date(2025, 9, 6, 0, 0, 0);
      const endDate = new Date(2025, 9, 8, 0, 0, 0);

      if (now >= startDate && now < endDate) {
        return "main_new.jpeg";
      }

      // 기본 이미지
      return "main_event.jpg";
    }

    // 이미지 소스 설정
    const image = document.getElementById("bg-image");
    image.src = determineImageSource();

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const previewParam = urlParams.get("v");

      if (previewParam === "_hangeul_truck_preview_20251006") {
        logEvent(analytics, "main_preview_view");
      } else {
        logEvent(analytics, "main_view");
      }
    });

    const clickableLinks = document.querySelectorAll(".clickable-link");

    clickableLinks.forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        const universityName = event.currentTarget.classList[1];
        const destinationUrl = event.currentTarget.href;
        const linkTarget = event.currentTarget.target;

        logEvent(analytics, `campus_${universityName}_clicked`);

        setTimeout(() => {
          window.open(destinationUrl, linkTarget);
        }, 300);
      });
    });
  </script>
</html>
