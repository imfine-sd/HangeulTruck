<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>HangeulTruck | Hashtag</title>
    <style>
      :root {
        --sky-blue: #619ef7;
        --dark-blue: #3f6ced;
        --split-point: 65.04%;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: clip;
      }

      .background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-color: var(--sky-blue);
      }

      body {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: flex-start;
      }

      #image-wrapper {
        position: relative;
        width: 100%;
        max-width: 600px;
        flex-shrink: 0;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
      }

      #image-wrapper.loaded {
        opacity: 1;
      }

      #bg-image {
        display: block;
        width: 100%;
        aspect-ratio: 1080 / 1920;
        position: relative;
        z-index: 2;
      }

      .click-area {
        position: absolute;
        cursor: pointer;
        z-index: 10;
        /* background-color: rgba(255, 0, 0, 0.2); */
      }

      #hashtag-copy-btn {
        top: 42.2%;
        left: 5%;
        width: 90%;
        height: 8%;
      }

      .click-area:active {
        /* transform: scale(0.95); */
      }

      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
      }

      @media (hover: none) {
        .click-area {
          -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <div class="background-container"></div>

    <div id="image-wrapper">
      <img id="bg-image" src="hashtag-vertical.jpg" alt="Hashtag Event" />

      <div
        id="hashtag-copy-btn"
        class="click-area"
        aria-label="Copy hashtags"
      ></div>
    </div>

    <div id="toast" class="toast">Hashtags copied to clipboard!</div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAnalytics,
        logEvent,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD9d2wSrmgCLdnr9ZtGGDARzaj78n6mm9I",
        authDomain: "hangul-truck.firebaseapp.com",
        projectId: "hangul-truck",
        storageBucket: "hangul-truck.firebasestorage.app",
        messagingSenderId: "141768649099",
        appId: "1:141768649099:web:2b7188b8f7b9ae77d4a78e",
        measurementId: "G-H4RZGYHQDV",
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);

      // 이미지 소스 결정 함수
      function determineImageSource() {
        const urlParams = new URLSearchParams(window.location.search);
        const previewParam = urlParams.get("v");

        // 미리보기 파라미터가 있으면 새 이미지 사용
        if (previewParam === "_hangeul_truck_preview_20251006") {
          return "hashtag_vertical_new.jpg";
        }

        // 현재 시간 체크 (브라우저 로컬 시간 기준)
        const now = new Date();

        // 2025년 10월 6일 00:00 ~ 10월 7일 24:00 (10월 8일 00:00 전까지)
        const startDate = new Date(2025, 9, 6, 0, 0, 0); // 월은 0부터 시작하므로 9 = 10월
        const endDate = new Date(2025, 9, 8, 0, 0, 0); // 10월 8일 00:00

        if (now >= startDate && now < endDate) {
          return "hashtag_vertical_new.jpg";
        }

        // 기본 이미지
        return "hashtag-vertical.jpg";
      }

      // 이미지 소스 설정
      const image = document.getElementById("bg-image");
      image.src = determineImageSource();

      function updateBackground() {
        const wrapper = document.getElementById("image-wrapper");
        const backgroundContainer = document.querySelector(
          ".background-container"
        );
        const rect = wrapper.getBoundingClientRect();
        const splitPoint =
          parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue(
              "--split-point"
            )
          ) / 100;

        const splitY = rect.top + rect.height * splitPoint;
        const viewportHeight = window.innerHeight;
        const splitPercentage = (splitY / viewportHeight) * 100;
        const skyBlue = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--sky-blue");
        const darkBlue = getComputedStyle(
          document.documentElement
        ).getPropertyValue("--dark-blue");

        backgroundContainer.style.background = `
          linear-gradient(
            to bottom,
            ${skyBlue} 0%,
            ${skyBlue} ${splitPercentage}%,
            ${darkBlue} ${splitPercentage}%,
            ${darkBlue} 100%
          )
        `;
      }

      const imageWrapper = document.getElementById("image-wrapper");

      function showContent() {
        updateBackground();
        imageWrapper.classList.add("loaded");
        logEvent(analytics, "hashtag_view");
      }

      if (image.complete) {
        showContent();
      } else {
        image.addEventListener("load", showContent);
      }

      window.addEventListener("resize", updateBackground);
      window.addEventListener("scroll", updateBackground);

      let toastTimer;

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        clearTimeout(toastTimer);
        toast.classList.add("show");
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      async function copyToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.top = "0";
          textArea.style.left = "0";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const success = document.execCommand("copy");
          document.body.removeChild(textArea);
          return success;
        } catch (err) {
          console.error("Failed to copy:", err);
          return false;
        }
      }

      document
        .getElementById("hashtag-copy-btn")
        .addEventListener("click", async function (e) {
          e.preventDefault();
          const hashtagText = "#HangeulTruck #GalaxyAI #Promo";
          const success = await copyToClipboard(hashtagText);
          if (success) {
            logEvent(analytics, "hashtag_copy");
            showToast("Hashtags copied to clipboard!");
          } else {
            showToast("Failed to copy. Please try again.");
          }
        });
    </script>
  </body>
</html>
